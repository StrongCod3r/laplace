<!doctype html>
<html lang="en" data-startup-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laplace</title>
    <link rel="icon" type="image/svg+xml" href="/laplace/icons/laplace.svg" />
    <link rel="manifest" href="/laplace/manifest.webmanifest" />
    <meta name="theme-color" content="#101216" />
    <script>
      try {
        const theme = localStorage.getItem('laplace-startup-theme');
        if (theme === 'light' || theme === 'dark')
          document.documentElement.dataset.startupTheme = theme;
      } catch {}
    </script>
    <style>/* Inlined for first paint; mirrors the default workspace chrome and editor. */
.startup-skeleton {
  --startup-workspace: #fff;
  --startup-sidebar: #f7f7f5;
  --startup-ribbon: #ebebeb;
  --startup-tabs: #eee;
  --startup-active-tab: #f7f7f7;
  --startup-border: rgba(55, 53, 47, 0.13);
  --startup-muted: #777;
  --startup-placeholder: rgba(55, 53, 47, 0.09);
  --startup-active: rgba(55, 53, 47, 0.08);
  --startup-accent: #7c3aed;
  position: fixed;
  inset: 0;
  z-index: 100;
  overflow: hidden;
  background: var(--startup-workspace);
  color: var(--startup-muted);
  font:
    12px ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    sans-serif;
}

html[data-startup-theme='dark'] .startup-skeleton {
  --startup-workspace: #202020;
  --startup-sidebar: #1e1e1e;
  --startup-ribbon: #191919;
  --startup-tabs: #1e1e1e;
  --startup-active-tab: #242424;
  --startup-border: #383838;
  --startup-muted: #9b9b9b;
  --startup-placeholder: rgba(255, 255, 255, 0.08);
  --startup-active: rgba(167, 139, 250, 0.14);
  --startup-accent: #c2c2c2;
}

@media (prefers-color-scheme: dark) {
  html[data-startup-theme='system'] .startup-skeleton {
    --startup-workspace: #202020;
    --startup-sidebar: #1e1e1e;
    --startup-ribbon: #191919;
    --startup-tabs: #1e1e1e;
    --startup-active-tab: #242424;
    --startup-border: #383838;
    --startup-muted: #9b9b9b;
    --startup-placeholder: rgba(255, 255, 255, 0.08);
    --startup-active: rgba(167, 139, 250, 0.14);
    --startup-accent: #c2c2c2;
  }
}

.startup-skeleton * {
  box-sizing: border-box;
}

.startup-layout {
  display: flex;
  height: 100%;
}

.startup-skeleton i {
  display: block;
  flex: none;
  width: 16px;
  height: 16px;
  border-radius: 3px;
  background: var(--startup-placeholder);
}

.startup-bar {
  display: block;
  width: 72%;
  height: 10px;
  border-radius: 4px;
  background: var(--startup-placeholder);
}

.startup-ribbon {
  min-width: 0;
  flex: 0 0 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 8px 5px;
  background: var(--startup-ribbon);
  border-right: 1px solid var(--startup-border);
  z-index: 3;
}

.startup-tools {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.startup-tools>span,
.startup-settings {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 6px;
}

.startup-tool-active {
  background: var(--startup-active);
}

.startup-sidebar,
.startup-context {
  flex: 0 0 276px;
  display: flex;
  flex-direction: column;
  background: var(--startup-sidebar);
  overflow: hidden;
}

.startup-sidebar-heading {
  height: 25px;
  margin: 10px 7px 0;
  padding: 0 7px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.045em;
  text-transform: uppercase;
}

.startup-section-actions {
  display: flex;
  gap: 8px;
}

.startup-section-actions i {
  width: 16px;
  height: 16px;
}

.startup-tree {
  padding: 0 7px 12px;
}

.startup-row {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 27px;
  padding: 0 10px 0 22px;
  border-radius: 4px;
}

.startup-row-active {
  background: var(--startup-active);
}

.startup-row i {
  width: 14px;
  height: 14px;
}

.startup-row .startup-bar {
  width: 56%;
  height: 9px;
}

.startup-row:nth-child(even) .startup-bar {
  width: 42%;
}

.startup-indented {
  padding-left: 40px;
}

.startup-workspace {
  margin-top: auto;
  padding: 6px 11px 10px;
  border-top: 1px solid var(--startup-border);
}

.startup-workspace-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 42px;
  border-top: 1px solid var(--startup-border);
  padding: 0 2px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.startup-workspace-heading>div {
  display: flex;
  gap: 12px;
}

.startup-workspace-select {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 28px;
  padding: 0 7px;
  border: 1px solid var(--startup-border);
  border-radius: 4px;
  background: var(--startup-workspace);
}

.startup-workspace-select .startup-bar {
  width: 48%;
  height: 8px;
}

.startup-workspace-select i {
  width: 8px;
  height: 8px;
}

.startup-resizer {
  flex: 0 0 4px;
  position: relative;
}

.startup-resizer::after {
  content: '';
  position: absolute;
  inset: 0 auto 0 1px;
  width: 1px;
  background: var(--startup-border);
}

.startup-main {
  flex: 1;
  min-width: 260px;
  background: var(--startup-workspace);
}

.startup-tabs {
  height: 39px;
  display: flex;
  padding-left: 2px;
  background: var(--startup-tabs);
  border-bottom: 1px solid var(--startup-border);
}

.startup-tab {
  position: relative;
  width: 190px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 8px 0 11px;
  background: var(--startup-active-tab);
  border-right: 1px solid var(--startup-border);
}

.startup-tab::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--startup-accent);
}

.startup-tab .startup-bar {
  flex: 1;
  height: 8px;
}

.startup-tab i {
  width: 14px;
  height: 14px;
}

.startup-tab .startup-close {
  width: 8px;
  height: 8px;
  margin-left: 16px;
}

.startup-breadcrumb {
  height: 36px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
}

.startup-breadcrumb i {
  width: 12px;
  height: 12px;
}

.startup-breadcrumb .startup-bar {
  width: 90px;
  height: 8px;
}

.startup-breadcrumb .startup-more {
  margin-left: auto;
  width: 4px;
  height: 12px;
}

.startup-editor {
  height: calc(100% - 75px);
  padding-right: 10px;
  overflow: hidden;
}

.startup-content {
  max-width: 760px;
  margin: 0 auto;
  padding: 30px 44px 36vh;
}

.startup-note-heading {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 38px;
  margin-bottom: 18px;
}

.startup-note-heading i {
  width: 30px;
  height: 30px;
  background: none;
  position: relative;
}

.startup-note-heading i::after {
  content: '';
  display: block;
  width: 16px;
  height: 20px;
  margin: 5px auto;
  border-radius: 3px;
  background: var(--startup-placeholder);
}

.startup-note-heading .startup-title {
  width: 40%;
  height: 25px;
}

.startup-paragraph {
  display: grid;
  gap: 15px;
  margin: 8px 0 26px;
}

.startup-paragraph .startup-bar {
  width: 94%;
  height: 10px;
}

.startup-paragraph .startup-bar:last-child {
  width: 70%;
}

.startup-subheading {
  width: 38%;
  height: 19px;
  margin-bottom: 18px;
}

.startup-context {
  flex-basis: 286px;
}

.startup-context-heading {
  display: flex;
  height: 39px;
  flex: none;
  border-bottom: 1px solid var(--startup-border);
  padding-right: 40px;
  position: relative;
  font-size: 11px;
  font-weight: 600;
}

.startup-context-heading span {
  display: grid;
  place-items: center;
  flex: 1;
}

.startup-context-active {
  border-bottom: 2px solid var(--startup-accent);
}

.startup-context-heading i {
  position: absolute;
  top: 12px;
  right: 13px;
  width: 14px;
  height: 14px;
}

.startup-outline {
  display: grid;
  gap: 20px;
  padding: 19px 16px;
}

.startup-outline .startup-bar {
  width: 50%;
  height: 8px;
}

.startup-outline .startup-bar:not(:first-child) {
  margin-left: 12px;
  width: 42%;
}

.startup-bar,
.startup-skeleton i {
  animation: startup-pulse 1.8s ease-in-out infinite;
}

@keyframes startup-pulse {
  50% {
    opacity: 0.65;
  }
}

.startup-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

@media (max-width: 1100px) {
  .startup-context {
    position: absolute;
    top: 0;
    bottom: 0;
    right: 0;
    width: 286px;
    z-index: 2;
    box-shadow: -8px 0 24px rgba(0, 0, 0, 0.18);
  }

  .startup-right-resizer {
    display: none;
  }
}

@media (max-width: 900px) {
  .startup-ribbon {
    flex-basis: 40px;
  }

  .startup-sidebar {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 40px;
    width: 276px;
    z-index: 1;
  }

  .startup-left-resizer {
    display: none;
  }

  .startup-content {
    padding-left: 42px;
    padding-right: 30px;
  }
}

@media (max-width: 600px) {
  .startup-ribbon {
    display: none;
  }

  .startup-sidebar {
    left: 0;
  }

  .startup-content {
    padding-left: 22px;
    padding-right: 22px;
  }
}

@media (prefers-reduced-motion: reduce) {

  .startup-bar,
  .startup-skeleton i {
    animation: none;
  }
}</style>

  <body>

      <div class="startup-tools">

        <div class="startup-section-actions"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="startup-tree">
        <div class="startup-row startup-row-active"><i></i><span class="startup-bar"></span></div>
        <div class="startup-row"><i></i><span class="startup-bar"></span></div>
        <div class="startup-row startup-indented"><i></i><span class="startup-bar"></span></div>
        <div class="startup-row startup-indented"><i></i><span class="startup-bar"></span></div>
      </div>
      <div class="startup-workspace">
        <div class="startup-workspace-heading">
          <span>Workspace</span>
          <div><i></i><i></i><i></i></div>
        </div>
        <div class="startup-workspace-select"><span class="startup-bar"></span><i></i></div>
      </div>
    </div>
    <div class="startup-resizer startup-left-resizer"></div>
    <div class="startup-main">
      <div class="startup-tabs">
        <div class="startup-tab">
          <i></i><span class="startup-bar"></span><i class="startup-close"></i>
        </div>
      </div>
      <div class="startup-breadcrumb">

            <span class="startup-bar"></span><span class="startup-bar"></span
            ><span class="startup-bar"></span>
          </div>
          <span class="startup-bar startup-subheading"></span>
          <div class="startup-paragraph">
            <span class="startup-bar"></span><span class="startup-bar"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="startup-resizer startup-right-resizer"></div>
    <div class="startup-context">
      <div class="startup-context-heading">
        <span class="startup-context-active">Outline</span><span>Backlinks</span><i></i>
      </div>
      <div class="startup-outline">
        <span class="startup-bar"></span><span class="startup-bar"></span
        ><span class="startup-bar"></span><span class="startup-bar"></span>
      </div>
    </div>
  </div>
</div>
</div>
